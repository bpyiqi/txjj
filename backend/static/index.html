<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102A43">
  <title>面向通信基建施工全过程的多源感知监管与数字化验真交付系统</title>
  <link rel="stylesheet" href="/styles.css?v=20260911-1">
  <link rel="stylesheet" href="/ui-overrides.css?v=20260911-4">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">验</div><div><strong>高速监管</strong><span>通信基建全过程</span></div></div>
    <nav id="nav">
      <button data-route="dashboard" class="active"><span>⌂</span>综合监管驾驶舱</button>
      <button data-route="map"><span>⌖</span>GIS施工态势</button>
      <button data-route="air"><span>⌘</span>气吹光缆监管</button>
      <button data-route="splicing"><span>♨</span>光纤熔接验真</button>
      <button data-route="safety"><span>♟</span>施工安全监管</button>
      <button data-route="issues"><span>▣</span>问题整改闭合</button>
      <button data-route="delivery"><span>▤</span>可信数字交付</button>
      <button data-route="audit"><span>▧</span>数据来源与审计</button>
    </nav>
    <div class="sidebar-foot"><i></i><span>系统运行正常</span></div>
  </aside>
  <main class="main-shell">
    <header class="topbar">
      <div class="project-heading"><strong>高速公路通信基建施工全过程数字化验真平台</strong></div>
      <div class="top-actions">
        <div class="sync-state"><i></i><span>系统运行正常</span></div>
        <div class="clock-state"><span id="updated-at">--</span><small>当前用户：项目管理</small></div>
        <div class="export-menu-wrap"><button id="export-btn" class="btn primary">数字交付 <span>⌄</span></button><div id="export-menu" class="export-menu hidden"><a href="/api/exports/excel">导出 Excel 验真数据</a><a href="/api/exports/pdf">导出 PDF 验真报告</a><hr><a href="/api/exports/archive">生成 ZIP 数字交付档案</a></div></div>
      </div>
    </header>
    <section id="page" class="page"></section>
  </main>
</div>
<div id="drawer-backdrop" class="backdrop hidden"></div>
<aside id="drawer" class="drawer"><div class="drawer-head"><h2 id="drawer-title">详情</h2><button id="drawer-close">×</button></div><div id="drawer-body" class="drawer-body"></div></aside>
<div id="modal-backdrop" class="backdrop hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-head"><h2 id="modal-title">操作</h2><button id="modal-close">×</button></div><div id="modal-body" class="modal-body"></div><div id="modal-actions" class="modal-actions"></div></div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="/app.js?v=20260911-9"></script>
</body>
</html>
